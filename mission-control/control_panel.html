        display: flex;

    .top-container {
        display: flex;

    .switch-group {

    .switch {
        width: 20px;
        height: 40px;
        background: #444;
        border: 2px solid #000;
        border-radius: 10px;
        position: relative;
        cursor: pointer;
    }
    
    .switch::before {
        content: '';
        width: 18px;
        height: 18px;
        background: #f00;
        border: 2px solid #000;
        border-radius: 50%;
        position: absolute;
        left: 0;
        top: 20px;
        right: 0;
        margin: auto;
        transition: 0.2s;
    }
    
    .switch.active::before {

        background: #0f0;
    }

<script>
/* =======================
   GLOBAL STATE
======================= */

let pyodideReady = false;
let pyodide;
let engageCalled = false; // Track if engage() was called

/* =======================
   STORYBOARD
======================= */

let storyboard = {};
let allowedMissionIds = [];
let allsys = 0;

/* =======================
    HELPER FUNCTIONS
======================= */

let currentMissionId = "sandbox";
let missionKeys = [];
let currentTaskIndex = 0;
let completedCorrectly = 0;
let completedByPass = 0;

function getMission(missionId) {
    return storyboard[missionId];
}

function isSandbox() {
    return !!storyboard[currentMissionId]?.sandbox;
}

async function loadStoryboard() {
    const response = await fetch("storyboard.json", { cache: "no-store" });
    if (!response.ok) {
        throw new Error(`Unable to load storyboard.json (${response.status})`);
    }
    storyboard = await response.json();
}

function missionSlug(value) {
    return String(value ?? "")
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
}

function requestedMissionTokens() {
    const params = new URLSearchParams(window.location.search);
    return [...params.getAll("mission"), ...params.getAll("missions")]
        .flatMap(value => value.split(","))
        .map(value => value.trim())
        .filter(Boolean);
}

function resolveMissionId(token) {
    const missionIds = Object.keys(storyboard);
    const exactMatch = missionIds.find(mid => mid === token);
    if (exactMatch) return exactMatch;

    const normalizedToken = missionSlug(token);
    return missionIds.find(mid => missionSlug(mid) === normalizedToken);
}

function getAllowedMissionIds() {
    const allMissionIds = Object.keys(storyboard);
    const sandboxId = allMissionIds.find(mid => storyboard[mid]?.sandbox) ?? "sandbox";
    const requestedTokens = requestedMissionTokens();
    const requestedIds = requestedTokens
        .map(resolveMissionId)
        .filter(Boolean)
        .filter(mid => mid !== sandboxId);

    const uniqueMissionIds = [...new Set([sandboxId, ...requestedIds])];
    if (requestedTokens.length && !requestedIds.length) {
        console.warn(`No requested missions were found: ${requestedTokens.join(", ")}`);
        return [sandboxId];
    }
    return requestedTokens.length ? uniqueMissionIds : allMissionIds;
}

function isMissionAllowed(missionId) {
    return allowedMissionIds.includes(missionId);
}

function populateMissionPicker(select) {
    select.innerHTML = "";
    allowedMissionIds.forEach(mid => {
        const opt = document.createElement("option");
        opt.value = mid;
        opt.textContent = mid;
        select.appendChild(opt);
        console.log("Added mission option:", mid);
    });
}

// Operator validation helper
function hasOperator(text, operator) {
    if (!operator || operator === "") return true; // empty string = no requirement
    return text.includes(operator);
}

// Parameter format validation helper
function checkParamFormat(param, format) {
    if (format === "na" || format === "") return true; // no restriction
    if (format === "dec") {
        // Enforce decimal-only operands/expressions:
        // - Disallow binary/hex/octal prefixes
        // - Restrict characters to digits, whitespace, parentheses, and common operators
        const hasNonDecimalPrefix = /0[bBoOxX]/.test(param);
        if (hasNonDecimalPrefix) return false;
        const invalidChars = /[^0-9\s\(\)\+\-\*\/\|\&\^\<\>]/.test(param);
        return !invalidChars;
    }
    if (format === "0b") return param.startsWith("0b") || param.startsWith("0B");
    if (format === "0o") return param.startsWith("0o") || param.startsWith("0O");
    if (format === "0x") return param.startsWith("0x") || param.startsWith("0X");
    return true; // unknown format = pass
}

function loadMission(missionId) {
    if (!isMissionAllowed(missionId)) {
        console.warn(`Mission "${missionId}" is not available in this embed.`);
        missionId = allowedMissionIds[0] ?? "sandbox";
    }

    currentMissionId = missionId;
    const mission = getMission(currentMissionId);
    if (!mission) {
        console.error(`Mission "${currentMissionId}" was not found.`);
        return;
    }

    if (mission.sandbox) {
        const seed = mission.seed_allsys ?? 0;
        allsys = seed;
        sessionStorage.setItem("allsys", allsys);
        updateSwitchesFromAllsys(allsys);
        missionKeys = [];
        currentTaskIndex = 0;
        completedCorrectly = 0;
        completedByPass = 0;
        updateCRT(mission.prompt ?? "SANDBOX MODE — Free Play");
        updateTaskCounter();
        return;
    }

    missionKeys = getTaskKeys(mission);
    
    // Load progress from localStorage
    const progress = loadMissionProgress(currentMissionId);
    completedCorrectly = progress.completed.length;
    completedByPass = progress.passed.length;
    
    // Find next incomplete task
    currentTaskIndex = getNextIncompleteTask(currentMissionId, missionKeys.length);
    
    // Check if mission is already complete
    if (currentTaskIndex >= missionKeys.length) {
        updateCRT("MISSION COMPLETE");
        updateTaskCounter();
        showMissionCompletionVideo();
        return;
    }
    
    // Set allsys to the expected starting state for this task
    const expectedState = getExpectedStartState(currentTaskIndex);
    allsys = expectedState;
    sessionStorage.setItem("allsys", allsys);
    updateSwitchesFromAllsys(allsys);
    
    updateCRT(currentTask().prompt);
    updateTaskCounter();
}

function getTaskKeys(missionObj) {
    return Object.keys(missionObj)
        .filter(k => k.startsWith("task_"))
        .sort((a, b) => {
            const na = parseInt(a.split("_")[1], 10);
            const nb = parseInt(b.split("_")[1], 10);
            return na - nb;
        });
}

function currentTask() {
    const mission = getMission(currentMissionId);
    return mission[missionKeys[currentTaskIndex]];
}

function updateCRT(text) {
    document.querySelector(".screen").innerText = text;
}

function checkTaskCompletion() {
    const task = currentTask();

    if (allsys === task.allsys) {
        completedCorrectly++;
        recordTaskCompletion(currentMissionId, currentTaskIndex);
        currentTaskIndex++;
        updateTaskCounter();
        if (missionKeys[currentTaskIndex]) {
            updateCRT(currentTask().prompt);
        } else {
            updateCRT("Mission complete. All systems nominal.");
            // Show completion video
            setTimeout(() => showMissionCompletionVideo(), 500);
        }
        return true;
    }
    return false;
}

function getExpectedStartState(index) {
    // Returns the expected starting state for the given task index (or current if undefined)
    const mission = getMission(currentMissionId);
    const idx = (typeof index === "number") ? index : currentTaskIndex;
    
    if (mission.sandbox) {
        return mission.seed_allsys ?? 0;
    }
    
    // For first task, use mission seed
    if (idx === 0) {
        return mission.seed_allsys ?? 0;
    }
    
    // For other tasks, return the previous task's target allsys
    const keys = getTaskKeys(mission);
    const prevTaskKey = keys[idx - 1];
    return mission[prevTaskKey].allsys;
}

function jumpToTask(taskNum) {
    // Admin: Jump to a specific task number and reset state to expected start
    const mission = getMission(currentMissionId);
    const keys = getTaskKeys(mission);
    const idx = taskNum - 1;

    if (!Number.isInteger(taskNum) || idx < 0 || idx >= keys.length) {
        displayOutput("Admin: invalid task number");
        return;
    }

    currentTaskIndex = idx;
    const expectedState = getExpectedStartState(idx);
    allsys = expectedState;
    sessionStorage.setItem("allsys", allsys);
    updateSwitchesFromAllsys(allsys);
    updateCRT(currentTask().prompt);
    displayOutput(`Admin: jumped to task ${taskNum}. State reset to ${expectedState}.`);
}

/* =======================
   PYODIDE INIT
======================= */

async function initPyodide() {
    pyodide = await loadPyodide();
    await pyodide.runPythonAsync(`
import sys
from io import StringIO
sys.stdout = StringIO()
`);
    
    // Define engage() function accessible from Python
    pyodide.globals.set("engage", (value) => {
        pyodide.globals.set("allsys", value);
        engageCalled = true;
    });
    
    pyodide.globals.set("allsys", allsys);
    pyodideReady = true;
}

initPyodide();

/* =======================
   OUTPUT HANDLING
======================= */

function displayOutput(output) {
    const consoleDiv = document.getElementById("console-window");
    consoleDiv.innerHTML = output.replace(/\n/g, "<br>");
}

/* =======================
   PYTHON EXECUTION
======================= */

async function runPython(code) {
    if (!pyodideReady) {
        displayOutput("Python runtime loading...");
        return;
    }

    const sandbox = isSandbox();

    // In sandbox, allow state commits freely (no format enforcement)
    const task = sandbox ? { allsys_format: "na", terminal_status: 1 } : currentTask();

    pyodide.globals.set("allsys", allsys);

    // FORMAT CHECK (terminal) — only meaningful when NOT sandbox
    let formatOK = true;
    if (!sandbox) {
        if (task.allsys_format === "0b") {
            formatOK = code.includes("0b") || code.includes("0B");
        } else if (task.allsys_format === "0x") {
            formatOK = code.includes("0x") || code.includes("0X");
        } else if (task.allsys_format === "0o") {
            formatOK = code.includes("0o") || code.includes("0O");
        } else if (task.allsys_format === "dec") {
            // Enforce decimal-only in terminal: disallow binary/hex/octal prefixes
            formatOK = !/(0[bB]|0[xX]|0[oO])/.test(code);
        }
    }

    // CODE OPERATOR CHECK (terminal) — only meaningful when NOT sandbox
    let codeOpOK = true;
    if (!sandbox) {
        const codeOp = task.code_op ?? "";
        if (codeOp && !hasOperator(code, codeOp)) {
            codeOpOK = false;
        }
    }

    try {
        engageCalled = false; // Reset flag
        await pyodide.runPythonAsync(code);

        const stdout = pyodide.runPython(`import sys; sys.stdout.getvalue()`);
        pyodide.runPython(`import sys; sys.stdout.truncate(0); sys.stdout.seek(0)`);

        const stdoutStr = stdout.toString();

        // Commit allsys ONLY if engage() was called
        if (engageCalled) {
            const newAllsys = pyodide.globals.get("allsys");
            const terminalEnabled = task.terminal_status ?? 1; // default to enabled
            if (sandbox || (terminalEnabled === 1 && formatOK && codeOpOK)) {
                allsys = newAllsys;
                sessionStorage.setItem("allsys", allsys);
                updateSwitchesFromAllsys(allsys);
            } else {
                // Validation failed in mission mode
                displayOutput("Command received – INCOMPLETE");
                return;
            }
        }

        // SANDBOX: stdout only, no progression, no messaging
        if (sandbox) {
            displayOutput(stdoutStr);
            return;
        }

        // MISSION: progression + feedback
        const completed = checkTaskCompletion();

        if (!completed && engageCalled) {
            displayOutput("Command received – INCOMPLETE");
        } else {
            displayOutput(stdoutStr);
        }

    } catch (err) {
        displayOutput("Error:\n" + err);
    }
}

/* =======================
   SWITCH UI
======================= */

function updateSwitchesFromAllsys(value) {
    for (let i = 0; i < 20; i++) {
        const el = document.getElementById(`switch-${i + 1}`);
        if (!el) continue;
        if (value & (1 << (19 - i))) el.classList.add("active");
        else el.classList.remove("active");
    }
}

/* =======================
   GEAR CODE PERSISTENCE
======================= */

function loadGearCodes() {
    const stored = localStorage.getItem('gearCodes');
    if (!stored) return {};
    try {
        return JSON.parse(stored);
    } catch (e) {
        return {};
    }
}

function saveGearCode(gearId, code) {
    const codes = loadGearCodes();
    codes[gearId] = code;
    localStorage.setItem('gearCodes', JSON.stringify(codes));
}

function getGearCode(gearId) {
    const codes = loadGearCodes();
    return codes[gearId] || "";
}

/* =======================
   MISSION PROGRESS PERSISTENCE
======================= */

function loadMissionProgress(missionId) {
    const stored = localStorage.getItem('missionProgress');
    if (!stored) return { completed: [], passed: [] };
    try {
        const progress = JSON.parse(stored);
        return progress[missionId] || { completed: [], passed: [] };
    } catch (e) {
        return { completed: [], passed: [] };
    }
}

function saveMissionProgress(missionId, progress) {
    const stored = localStorage.getItem('missionProgress');
    let allProgress = {};
    try {
        allProgress = JSON.parse(stored) || {};
    } catch (e) {
        allProgress = {};
    }
    allProgress[missionId] = progress;
    localStorage.setItem('missionProgress', JSON.stringify(allProgress));
}

function recordTaskCompletion(missionId, taskIndex) {
    const progress = loadMissionProgress(missionId);
    if (!progress.completed.includes(taskIndex)) {
        progress.completed.push(taskIndex);
    }
    // Remove from passed array if it was previously passed but now completed
    const passedIndex = progress.passed.indexOf(taskIndex);
    if (passedIndex !== -1) {
        progress.passed.splice(passedIndex, 1);
    }
    saveMissionProgress(missionId, progress);
    
    // Update global variables to reflect the new state
    completedCorrectly = progress.completed.length;
    completedByPass = progress.passed.length;
}

function recordTaskPass(missionId, taskIndex) {
    const progress = loadMissionProgress(missionId);
    if (!progress.passed.includes(taskIndex)) {
        progress.passed.push(taskIndex);
    }
    saveMissionProgress(missionId, progress);
}

function getNextIncompleteTask(missionId, totalTasks) {
    const progress = loadMissionProgress(missionId);
    for (let i = 0; i < totalTasks; i++) {
        if (!progress.completed.includes(i) && !progress.passed.includes(i)) {
            return i;
        }
    }
    return totalTasks; // All tasks done
}

function updateGearIcons() {
    for (let i = 1; i <= 5; i++) {
        const gearIcon = document.getElementById(`gear-${i}`);
        if (!gearIcon) continue;
        const code = getGearCode(String(i));
        if (code && code.trim() !== "") {
            gearIcon.classList.add("has-code");
        } else {
            gearIcon.classList.remove("has-code");
        }
    }
}

function updateTaskCounter() {
    const counterEl = document.getElementById("task-counter");
    if (!counterEl) return;
    
    const mission = getMission(currentMissionId);
    
    // Hide counter in sandbox mode
    if (mission.sandbox) {
        counterEl.style.display = "none";
        return;
    }
    
    counterEl.style.display = "block";
    const totalTasks = missionKeys.length;
    
    // Check if mission is complete (all tasks finished)
    if (currentTaskIndex >= totalTasks) {
        const percentage = Math.round((completedCorrectly / totalTasks) * 100);
        const color = percentage >= 80 ? "#0f0" : "#f00"; // Green if 80+, red otherwise
        counterEl.innerHTML = `<span style="color: ${color};">${percentage}%</span>`;
        return;
    }
    
    const currentTask = currentTaskIndex + 1; // Display as 1-indexed
    
    // Format: 10 (6 / 3) / 20
    // Current task (correct / passed) / total
    counterEl.innerHTML = `${currentTask} (<span style="color: #0f0;">${completedCorrectly}</span> / <span style="color: #f00;">${completedByPass}</span>) / ${totalTasks}`;
    
    // Update task selector
    updateTaskSelector();
}

function updateTaskSelector() {
    const selectEl = document.getElementById("task-select");
    const mission = getMission(currentMissionId);
    
    if (!selectEl || mission.sandbox) {
        selectEl.style.display = "none";
        return;
    }
    
    selectEl.style.display = "block";
    const progress = loadMissionProgress(currentMissionId);
    
    // Clear existing options except the first one
    while (selectEl.options.length > 1) {
        selectEl.remove(1);
    }
    
    // Add task options
    missionKeys.forEach((key, index) => {
        const taskNum = index + 1;
        const option = document.createElement("option");
        option.value = index;
        option.textContent = `Task ${taskNum}`;
        
        if (progress.completed.includes(index)) {
            option.className = "completed";
            option.textContent += " ✓";
        } else if (progress.passed.includes(index)) {
            option.className = "passed";
            option.textContent += " (passed)";
        } else {
            option.className = "not-attempted";
        }
        
        selectEl.appendChild(option);
    });
}

function jumpToTask() {
    const selectEl = document.getElementById("task-select");
    const taskIndex = parseInt(selectEl.value);
    
    if (isNaN(taskIndex)) return;
    
    currentTaskIndex = taskIndex;
    const expectedState = getExpectedStartState(currentTaskIndex);
    allsys = expectedState;
    sessionStorage.setItem("allsys", allsys);
    updateSwitchesFromAllsys(allsys);
    
    updateCRT(currentTask().prompt);
    updateTaskCounter();
    selectEl.value = ""; // Reset dropdown
}

function passTask() {
    const mission = getMission(currentMissionId);
    
    // Can't pass in sandbox mode
    if (mission.sandbox) {
        displayOutput("PASS not available in sandbox mode.");
        return;
    }
    
    // Track as passed
    completedByPass++;
    recordTaskPass(currentMissionId, currentTaskIndex);
    currentTaskIndex++;
    
    // Check if mission is complete
    if (currentTaskIndex >= missionKeys.length) {
        updateCRT("Mission complete. All systems nominal.");
        updateTaskCounter();
        // Show completion video
        setTimeout(() => showMissionCompletionVideo(), 500);
        displayOutput("Mission complete!");
        return;
    }
    
    // Set allsys to the expected start state for this task
    const expectedState = getExpectedStartState();
    allsys = expectedState;
    sessionStorage.setItem("allsys", allsys);
    updateSwitchesFromAllsys(allsys);
    
    // Update UI
    updateCRT(currentTask().prompt);
    updateTaskCounter();
    displayOutput(`Passed to next task. State set to: ${expectedState}`);
}

function showMissionCompletionVideo() {
    const totalTasks = missionKeys.length;
    const percentage = Math.round((completedCorrectly / totalTasks) * 100);
    const videoModal = document.getElementById("videoModal");
    const videoFrame = document.getElementById("video-frame");
    const videoMessage = document.getElementById("video-message");
    
    videoFrame.style.display = "block"; // Make sure video is visible
    
    if (percentage >= 80) {
        // Success video
        videoFrame.src = "https://www.youtube.com/embed/GuLrHArxgIM?si=b7Liv5Dl5-uZzt3y&autoplay=1";
        videoMessage.textContent = `Mission Complete! Score: ${percentage}% - Excellent work, commander!`;
    } else {
        // Fail video
        videoFrame.src = "https://www.youtube.com/embed/NnXPSuvM1A0?si=gnewVw2z2UF9g8Ll&autoplay=1";
        videoMessage.textContent = `Mission Complete! Score: ${percentage}% - Keep training, commander!`;
    }
    
    videoModal.style.display = "block";
}

/* =======================
   DOM READY
======================= */

document.addEventListener("DOMContentLoaded", async () => {

    const select = document.getElementById("mission-select");
    const loadBtn = document.getElementById("load-mission-btn");

    if (!select) {
        console.error("mission-select element not found");
        return;
    }

    try {
        await loadStoryboard();
    } catch (error) {
        console.error(error);
        select.innerHTML = "";
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "Missions unavailable";
        select.appendChild(opt);
        select.disabled = true;
        if (loadBtn) loadBtn.disabled = true;
        updateCRT("Mission data could not be loaded. Please check that storyboard.json is available beside control_panel.html.");
        return;
    }

    allowedMissionIds = getAllowedMissionIds();

    console.log("Storyboard missions:", Object.keys(storyboard));
    console.log("Available missions:", allowedMissionIds);

    populateMissionPicker(select);

    currentMissionId = isMissionAllowed(currentMissionId)
        ? currentMissionId
        : allowedMissionIds[0] ?? "sandbox";
    select.value = currentMissionId;

    loadBtn.addEventListener("click", () => {
        loadMission(select.value);
    });

    // initial load
    loadMission(currentMissionId);
    
    /* CodeMirror */
    const editor = CodeMirror.fromTextArea(
        document.getElementById("code-editor"),
        { lineNumbers: true, mode: "python", theme: "dracula" }
    );

    /* TERMINAL EXECUTION */
    document.getElementById("submit-btn").onclick = () => {
        const code = editor.getValue();
        runPython(code);
    };
    
    /* RESET STATE BUTTON */
    document.getElementById("reset-btn").onclick = () => {
        const expectedState = getExpectedStartState();
        allsys = expectedState;
        sessionStorage.setItem("allsys", allsys);
        updateSwitchesFromAllsys(allsys);
        displayOutput(`State reset to: ${expectedState}`);
    };

    /* PASS BUTTON */
    document.getElementById("pass-btn").onclick = () => {
        passTask();
    };

    /* ADMIN JUMP (Ctrl+Shift+G) */
    document.addEventListener("keydown", (e) => {
        if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "g") {
            e.preventDefault(); // Prevent any default browser behavior
            const input = prompt("Admin jump: Enter task number");
            if (!input) return;
            const num = parseInt(input, 10);
            if (Number.isNaN(num)) {
                displayOutput("Admin: invalid task number");
                return;
            }
            jumpToTask(num);
        }
    });

    /* FUNCTION BUTTONS */
    document.querySelectorAll(".function-btn").forEach(button => {
        button.addEventListener("click", async function () {

            if (!pyodideReady) {
                displayOutput("Python runtime loading...");
                return;
            }

            const sandbox = isSandbox();

            const id = this.id.replace("func-", "");
            const rawParam = document.getElementById(`arg-${id}`).value.trim();
            const code = getGearCode(id);

            if (!code) {
                displayOutput("No code assigned to this function.");
                return;
            }

            const task = sandbox ? { param_format: "na", param_op: "", func_op: "" } : currentTask();

            // VALIDATION CHECKS — mission-only
            let validationOK = true;
            if (!sandbox) {
                // Check parameter format (0b, 0o, 0x, or decimal)
                const paramFormat = task.param_format ?? "na";
                if (!checkParamFormat(rawParam, paramFormat)) {
                    validationOK = false;
                }
                
                // Check parameter operator requirement
                const paramOp = task.param_op ?? "";
                if (validationOK && !hasOperator(rawParam, paramOp)) {
                    validationOK = false;
                }
                
                // Check function code operator requirement
                const funcOp = task.func_op ?? "";
                if (validationOK && !hasOperator(code, funcOp)) {
                    validationOK = false;
                }
            }

            try {
                pyodide.globals.set("allsys", allsys);

                engageCalled = false; // Reset flag
                const wrappedCode = `mask = ${rawParam}
${code}

f${id}(mask)
`;

                await pyodide.runPythonAsync(wrappedCode);

                const stdout = pyodide.runPython(`import sys; sys.stdout.getvalue()`);
                pyodide.runPython(`import sys; sys.stdout.truncate(0); sys.stdout.seek(0)`);

                const stdoutStr = stdout.toString();

                // Commit rules:
                // - sandbox: always commit if engage() was called
                // - mission: commit only if validationOK
                if (engageCalled) {
                    const newAllsys = pyodide.globals.get("allsys");
                    if (sandbox || validationOK) {
                        allsys = newAllsys;
                        sessionStorage.setItem("allsys", allsys);
                        updateSwitchesFromAllsys(allsys);
                    } else {
                        // Validation failed in mission mode
                        displayOutput("Command received – INCOMPLETE");
                        return;
                    }
                }

                // SANDBOX: stdout only, no progression, no messaging
                if (sandbox) {
                    displayOutput(stdoutStr);
                    return;
                }

                // MISSION: progression + feedback
                const completed = checkTaskCompletion();

                if (!completed && engageCalled) {
                    displayOutput("Command received – INCOMPLETE");
                } else {
                    displayOutput(stdoutStr);
                }

            } catch (err) {
                displayOutput("Error:\n" + err);
            }
        });
    });

    /* MODAL CODE EDITOR */
    const modal = document.getElementById("codeModal");
    const closeBtn = document.querySelector(".close");
    let modalEditor, currentGear;

    document.querySelectorAll(".gear-icon").forEach(icon => {
        icon.onclick = () => {
            currentGear = icon.id.replace("gear-", "");
            modal.style.display = "block";

            if (!modalEditor) {
                modalEditor = CodeMirror.fromTextArea(
                    document.getElementById("code-editor-modal"),
                    { lineNumbers: true, mode: "python", theme: "dracula" }
                );
            }

            modalEditor.setValue(getGearCode(currentGear));
        };
    });

    document.getElementById("save-code").onclick = () => {
        saveGearCode(currentGear, modalEditor.getValue());
        updateGearIcons();
        modal.style.display = "none";
    };

    closeBtn.onclick = () => modal.style.display = "none";
    window.onclick = e => { if (e.target === modal) modal.style.display = "none"; };

    /* VIDEO MODAL */
    const videoModal = document.getElementById("videoModal");
    const videoFrame = document.getElementById("video-frame");
    const videoCloseBtn = document.querySelector(".video-close");

    function closeVideoModal() {
        videoModal.style.display = "none";
        // Clearing iframe src ensures embedded video/audio is fully stopped.
        videoFrame.src = "";
    }
    
    videoCloseBtn.onclick = closeVideoModal;
    window.onclick = e => {
        if (e.target === videoModal) closeVideoModal();
        if (e.target === modal) modal.style.display = "none";
    };

    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && videoModal.style.display === "block") {
            closeVideoModal();
        }
    });

    /* INITIAL UI */
    updateSwitchesFromAllsys(allsys);
    updateGearIcons();
    updateTaskCounter();
});
</script>
