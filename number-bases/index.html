<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Number Bases Downloads</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17202a;
      --muted: #5d6773;
      --line: #bac7d5;
      --paper: #ffffff;
      --accent: #0f6b5f;
      --accent-dark: #09483f;
      --warn: #8a4b00;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: transparent;
    }

    main {
      width: 100%;
      margin: 0;
      padding: 4px;
    }

    .download-link {
      width: 100%;
      min-height: 48px;
      display: none;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: var(--paper);
      font: inherit;
      text-align: left;
      cursor: pointer;
      appearance: none;
    }

    .download-link:hover,
    .download-link:focus-visible {
      border-color: var(--accent);
      outline: 2px solid transparent;
      box-shadow: 0 0 0 2px rgba(15, 107, 95, 0.18);
    }

    .file-icon {
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 5px;
      color: white;
      background: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0;
    }

    .file-text {
      min-width: 0;
    }

    .file-name,
    .file-type {
      display: block;
      overflow-wrap: anywhere;
    }

    .file-name {
      font-weight: 700;
      line-height: 1.2;
    }

    .file-type {
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.2;
    }

    .status {
      margin: 4px 0 0;
      color: var(--warn);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <button class="download-link" type="button" aria-label="Download file">
      <span class="file-icon" aria-hidden="true">IPY</span>
      <span class="file-text">
        <span class="file-name"></span>
        <span class="file-type">Jupyter notebook</span>
      </span>
    </button>

    <p class="status" role="status" aria-live="polite"></p>
  </main>

  <script>
    const statusEl = document.querySelector(".status");
    const downloadLink = document.querySelector(".download-link");
    const fileNameEl = document.querySelector(".file-name");

    function getRequestedFile() {
      const params = new URLSearchParams(window.location.search);
      const fileName = params.get("file");

      if (!fileName || fileName.includes("/") || fileName.includes("\\")) {
        return "";
      }

      return fileName;
    }

    async function downloadNotebook(fileName) {
      statusEl.textContent = "";

      try {
        const response = await fetch(fileName, { cache: "no-store" });

        if (!response.ok) {
          throw new Error(`Could not find ${fileName}.`);
        }

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      } catch (error) {
        statusEl.textContent = error.message || "The download could not be started.";
      }
    }

    const requestedFile = getRequestedFile();

    if (requestedFile) {
      fileNameEl.textContent = requestedFile;
      downloadLink.setAttribute("aria-label", `Download ${requestedFile}`);
      downloadLink.addEventListener("click", () => downloadNotebook(requestedFile));
      downloadLink.style.display = "flex";
    } else {
      statusEl.textContent = "No file was selected for download.";
    }
  </script>
</body>
</html>
